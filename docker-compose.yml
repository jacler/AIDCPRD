services:
  postgres:
    image: postgres:15-alpine
    container_name: aidc-costpro-db
    environment:
      POSTGRES_USER: aidc
      POSTGRES_PASSWORD: aidc_dev_password
      POSTGRES_DB: aidc_costpro
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidc -d aidc_costpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aidc-costpro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
